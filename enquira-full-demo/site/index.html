  --scrim:rgba(10,22,40,.48);--toast-bg:#0A1628;--shimmer:rgba(255,255,255,.6);--code-bg:#0A1628;

  --success-fill:#0B7A50;--on-success-fill:#FFFFFF;
  --info-text:#0857B0;--info-bg:#E8F2FE;--info-solid:#0080F0;
  --success-text:#0B7A50;--success-bg:#E7F6EF;--success-solid:#10A36B;
  --warning-text:#8A5300;--warning-bg:#FDF4E3;--warning-solid:#D08A00;
  --danger-text:#B83A3A;--danger-bg:#FDEEEE;--danger-solid:#D64545;
  --teal-text:#0B6A73;--teal-bg:#E6F6F7;--teal-solid:#0E8A96;
  --violet-text:#5B3FC4;--violet-bg:#F1EDFE;--violet-solid:#7C5CFF;
  --rose-text:#A12D6E;--rose-bg:#FCEAF4;--rose-solid:#D6459A;
  --neutral-text:#3D4757;--neutral-bg:#EEF0F3;--neutral-solid:#9AA3B2;
  --muted-text:#687180;--muted-bg:#F4F5F7;--muted-solid:#9AA3B2;
  --hot-text:#C2410C;--hot-bg:#FFEFE6;--cold-text:#0857B0;--cold-bg:#EAF4FF;
  --shadow-float:0 12px 40px rgba(10,22,40,.10),0 2px 8px rgba(10,22,40,.06);
  --shadow-modal:0 24px 64px rgba(10,22,40,.18),0 4px 12px rgba(10,22,40,.08);
  --ease:cubic-bezier(.2,.8,.2,1);--ease-exit:cubic-bezier(.4,0,1,1);
  --font-sans:"Inter","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Arabic",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --font-display:"Sora","Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}

}}
:root[data-theme="dark"]{

  --bg:#0A1628;--surface:#0F1D33;--surface-2:#12233B;--hover:#1C2A40;--border:#22324A;--border-strong:#2E3F5A;
  --text:#E8EDF5;--text-secondary:#A9B4C4;--text-muted:#8D99AB;

  --success-text:#4ADE9B;--success-bg:#0E2A20;--success-solid:#22C07F;
  --warning-text:#F5B84B;--warning-bg:#2E2310;--warning-solid:#E2A029;
  --danger-text:#FF8A8A;--danger-bg:#34161A;--danger-solid:#F05D5D;
  --teal-text:#4FD1DB;--teal-bg:#0F2B30;--teal-solid:#22B3BF;
  --violet-text:#B5A1FF;--violet-bg:#221B42;--violet-solid:#9A82FF;
  --rose-text:#F28CC4;--rose-bg:#33172A;--rose-solid:#E361AC;
  --neutral-text:#B6C0CE;--neutral-bg:#1C2A40;--neutral-solid:#5E6B80;
  --muted-text:#8D99AB;--muted-bg:#12233B;--muted-solid:#5E6B80;
  --hot-text:#FF9E6E;--hot-bg:#34200F;--cold-text:#7CC0FF;--cold-bg:#0F2A4A;
  --shadow-float:0 12px 40px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);
  --shadow-modal:0 24px 64px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.35);
}

/* ===== Base ===== */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 24px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/20px var(--font-sans);font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--tint)}
.mono{font-family:var(--font-mono);font-size:13px;line-height:18px}
.tabular{font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}.secondary{color:var(--text-secondary)}
.cap{font-size:12px;line-height:16px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.sm{width:16px;height:16px}
.ic.spark{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Shell ===== */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr)}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--sidebar-bg);padding:22px 14px 16px;display:flex;flex-direction:column}
.side .brand{display:block;padding:2px 10px 24px}
.side .brand svg{height:30px;width:auto;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:var(--sidebar-text);font-weight:500;position:relative;transition:background-color .15s var(--ease),color .15s var(--ease)}
.nav a:hover{background:var(--sidebar-hover);color:#fff;text-decoration:none}
.nav a.on{background:var(--sidebar-hover);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--sidebar-active)}
.side .foot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:10px}
.theme{display:flex;background:rgba(255,255,255,.07);border-radius:10px;padding:3px;gap:2px}
.theme button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:32px;border:0;border-radius:8px;background:none;color:var(--sidebar-text);cursor:pointer;font-size:12px;font-weight:500;transition:background-color .15s var(--ease),color .15s var(--ease)}
.theme button:hover{color:#fff}
.theme button[aria-pressed="true"]{background:#fff;color:#0A1628}
.kbtn{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:none;color:var(--sidebar-text);cursor:pointer;font-weight:500}
.kbtn:hover{color:#fff;background:var(--sidebar-hover)}
.kbd{margin-left:auto;font:500 11px/16px var(--font-sans);padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.75}
.mtop{display:none}
main{min-width:0;padding:40px 48px 96px}
.wrap{max-width:1120px;margin:0 auto}
@media (max-width:1023px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .mtop .logo svg{height:26px;width:auto;display:block}
  .mtop .logo span{white-space:nowrap}
  .mtop select{margin-left:auto;height:36px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);padding:0 10px;max-width:46vw}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
  main{padding:24px 16px 88px}
}
@media (max-width:480px){
  .mtop .logo span{display:none}
  .mtop select{max-width:none;flex:1}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;color:var(--text-secondary)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}

/* ===== Sections ===== */
section.sec{padding-top:80px}
section.sec:first-of-type{padding-top:0}
.sec-head{margin-bottom:24px}
.sec-head h2{font:600 28px/36px var(--font-display);letter-spacing:-.015em}
.sec-head p{color:var(--text-secondary);max-width:70ch;margin-top:8px;font-size:15px;line-height:22px}
h3.sub{font:600 18px/26px var(--font-sans);letter-spacing:-.005em;margin:44px 0 6px}
p.subp{color:var(--text-secondary);max-width:70ch;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:separate;border-spacing:0}
table.t th{background:var(--surface-2);color:var(--text-secondary);font-size:12px;line-height:16px;font-weight:500;text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{padding:14px 16px;border-bottom:1px solid var(--hover);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t th:first-child{border-top-left-radius:15px}table.t th:last-child{border-top-right-radius:15px}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ===== Overview ===== */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:stretch}
.hero h1{font:600 44px/52px var(--font-display);letter-spacing:-.025em}
.hero .lede{font-size:16px;line-height:25px;color:var(--text-secondary);margin-top:14px;max-width:54ch}
.hero .actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.hero .vis{background:var(--sidebar-bg);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:260px;padding:28px;text-align:center}
.hero .vis svg{width:132px;height:auto}
.hero .vis p{color:#A9B4C4;font:500 16px/24px var(--font-display)}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero h1{font-size:34px;line-height:42px}}
.qr td:first-child{font-weight:500;white-space:nowrap;width:30%}

/* ===== Logo ===== */
.stage{border-radius:16px;display:flex;align-items:center;justify-content:center;min-height:200px;padding:28px}
.stage.light{background:#F4F5F7}.stage.navy{background:#0A1628}
.stage svg.lock{width:min(360px,100%);height:auto}
.sizes{display:flex;align-items:flex-end;gap:22px}
.sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.sizes figcaption{font-size:12px;color:var(--text-muted)}
.sparkrow{display:flex;flex-wrap:wrap;gap:10px}

/* ===== Colour ===== */
.sw{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:border-color .15s var(--ease)}
.sw:hover{border-color:var(--border-strong)}
.sw .c{height:92px;display:flex;align-items:flex-end;padding:10px 12px;font:600 15px/20px var(--font-display)}
.sw .m{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.sw .n{font-weight:600}
.sw .h{font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--text-secondary)}
.sw .r{font-size:12px;line-height:16px;color:var(--text-muted)}
.ratios{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rb{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;background:var(--surface-2);color:var(--text-secondary)}
.rb b{font-weight:600;color:var(--text)}
.scale{display:grid;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.scale button{border:0;height:92px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;font-size:12px;line-height:16px;cursor:pointer;text-align:left;font-weight:500}
.scale button span{font-family:var(--font-mono);font-weight:400;font-size:11px;opacity:.9}
.scale.blue{grid-template-columns:repeat(11,minmax(58px,1fr))}.scale.ink{grid-template-columns:repeat(14,minmax(52px,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;color:var(--t);background:var(--b);border:0}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--s);flex:none}
.chip .ic{width:14px;height:14px}
[data-tone="info"]{--t:var(--info-text);--b:var(--info-bg);--s:var(--info-solid)}
[data-tone="success"]{--t:var(--success-text);--b:var(--success-bg);--s:var(--success-solid)}
[data-tone="warning"]{--t:var(--warning-text);--b:var(--warning-bg);--s:var(--warning-solid)}
[data-tone="danger"]{--t:var(--danger-text);--b:var(--danger-bg);--s:var(--danger-solid)}
[data-tone="teal"]{--t:var(--teal-text);--b:var(--teal-bg);--s:var(--teal-solid)}
[data-tone="violet"]{--t:var(--violet-text);--b:var(--violet-bg);--s:var(--violet-solid)}
[data-tone="rose"]{--t:var(--rose-text);--b:var(--rose-bg);--s:var(--rose-solid)}
[data-tone="neutral"]{--t:var(--neutral-text);--b:var(--neutral-bg);--s:var(--neutral-solid)}
[data-tone="muted"]{--t:var(--muted-text);--b:var(--muted-bg);--s:var(--muted-solid)}
[data-tone="hot"]{--t:var(--hot-text);--b:var(--hot-bg);--s:var(--hot-text)}
[data-tone="cold"]{--t:var(--cold-text);--b:var(--cold-bg);--s:var(--cold-text)}
.chip.filled{color:var(--on-success-fill);background:var(--success-fill)}.chip.filled .dot{background:var(--on-success-fill)}
.chip.outline{background:transparent;box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--text-secondary)}
.chip.strike .lb{text-decoration:line-through}
button.chip{cursor:pointer}button.chip:hover{filter:brightness(.97)}
.maprow{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--hover);align-items:center}
.maprow:last-child{border-bottom:0}
.maprow h4{font-weight:600;font-size:14px}.maprow p{font-size:12px;color:var(--text-muted);margin-top:2px}
@media (max-width:760px){.maprow{grid-template-columns:1fr}}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:12px;align-items:center}
.bar i{display:block;height:14px;border-radius:0 4px 4px 0;transform-origin:left;animation:grow .6s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.funnel{display:flex;flex-direction:column;gap:6px}
.funnel div{height:38px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#0A1628;font-weight:500;margin:0 auto;font-variant-numeric:tabular-nums}

/* ===== Type ===== */
.spec{display:grid;grid-template-columns:140px minmax(0,1fr) 210px;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--hover)}
.spec .tk{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary)}
.spec .sp{font-size:12px;color:var(--text-muted)}
@media (max-width:760px){.spec{grid-template-columns:1fr;gap:4px}}
.fam{display:flex;flex-direction:column;gap:10px}
.fam .big{font-size:56px;line-height:60px;letter-spacing:-.02em}

/* ===== Layout ===== */
.spc{display:grid;grid-template-columns:110px 60px minmax(0,1fr);gap:12px;align-items:center;padding:6px 0}
.spc i{display:block;height:12px;background:var(--brand);border-radius:3px;opacity:.85}
.radii{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.radii div{height:96px;border:1.5px solid var(--brand);background:var(--tint);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:500}
@media (max-width:760px){.radii{grid-template-columns:repeat(3,minmax(0,1fr))}}
.elev{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.elev div{height:120px;background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
@media (max-width:860px){.elev{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease);text-decoration:none}
.btn:hover{text-decoration:none}
.btn-primary{background:var(--primary);color:var(--on-primary)}.btn-primary:hover{background:var(--primary-hover)}.btn-primary:active{background:var(--primary-active)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--text)}.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-secondary)}.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{background:var(--danger-fill);color:var(--on-danger)}.btn-danger:hover{background:var(--danger-fill-hover)}
.btn-link{background:none;border:0;padding:0;height:auto;color:var(--primary)}.btn-link:hover{text-decoration:underline}
.btn-ai .spark{color:var(--brand)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}.btn-lg{height:48px;padding:0 20px;font-size:16px}
.btn[disabled]{background:var(--surface-2);color:var(--text-muted);border-color:var(--border);cursor:not-allowed}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Forms ===== */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:500}
.input,.select,.affix{height:40px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);width:100%;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.input{padding:0 12px}.input::placeholder,.affix input::placeholder,textarea::placeholder{color:var(--text-muted)}
.select{padding:0 10px}
.input:focus,.select:focus,.affix:focus-within{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--focus)}
.input.err{border-color:var(--danger-text)}
.help{font-size:12px;line-height:16px;color:var(--text-muted)}
.errmsg{font-size:12px;line-height:16px;color:var(--danger-text);display:flex;gap:6px;align-items:center}
.affix{display:flex;align-items:center;overflow:hidden}
.affix select,.affix input{border:0;background:transparent;height:100%;outline:none}
.affix select{padding:0 8px 0 12px;border-right:1px solid var(--border);color:var(--text-secondary)}
.affix input{flex:1;min-width:0;padding:0 12px}
.affix .pre{padding:0 0 0 12px;color:var(--text-secondary);font-weight:500}
.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--primary);margin:0}
.switch{width:36px;height:20px;border-radius:999px;border:0;background:var(--border-strong);position:relative;cursor:pointer;flex:none;transition:background-color .15s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--primary)}.switch[aria-checked="true"]::after{transform:translateX(16px)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:none;color:var(--text-secondary);font-weight:500;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);border-color:var(--border);color:var(--text)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;color:var(--text-secondary)}
.fchip[aria-pressed="true"]{background:var(--tint);border-color:transparent;color:var(--info-text)}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:var(--surface-2);color:var(--text-secondary);font-size:12px;font-weight:500}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11px;font-weight:600;background:var(--hover);color:var(--text)}
.count.alert{background:var(--danger-fill);color:var(--on-danger)}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.av.lead{background:var(--hover);color:var(--neutral-text)}.av.ai{background:var(--tint);color:var(--brand)}
.av.s24{width:24px;height:24px;font-size:10px}.av.s40{width:40px;height:40px;font-size:14px}.av.s56{width:56px;height:56px;font-size:18px}

/* ===== Metrics ===== */
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.tile .lbl{font-size:12px;line-height:16px;color:var(--text-secondary);font-weight:500}
.tile .val{font:600 28px/32px var(--font-display);letter-spacing:-.015em;margin-top:10px;font-variant-numeric:tabular-nums}
.delta{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;line-height:16px;color:var(--text-muted)}
.delta b{font-weight:600}.delta .good{color:var(--success-text)}.delta .bad{color:var(--danger-text)}
.five{background:var(--sidebar-bg);color:#fff;border-radius:16px;padding:24px;display:flex;gap:24px;align-items:center;grid-column:span 2}
@media (max-width:1100px){.five{grid-column:span 2}}
@media (max-width:760px){.five{grid-column:auto;flex-direction:column;align-items:flex-start}}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .ic{position:absolute;color:#3B9EFF;width:16px;height:16px}
.five .big{font:600 40px/44px var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.five .sub{color:#A9B4C4;margin-top:4px;font-size:14px}
.five .note{color:#8D99AB;font-size:12px;line-height:18px;margin-top:12px}
.five a{color:#7CC0FF}

/* ===== Leads table ===== */
.tbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tbar .search{position:relative;flex:1;min-width:200px;max-width:320px}
.tbar .search .ic{position:absolute;left:10px;top:10px;color:var(--text-muted)}
.tbar .search input{padding-left:36px}
.leads td{transition:background-color .15s var(--ease)}
.leads tbody tr:hover td{background:var(--surface-2)}
.leads tr.sel td{background:color-mix(in srgb,var(--brand) 5%,var(--surface))}
.leads tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.leads tr.flash td{animation:flash 2s var(--ease)}
@keyframes flash{0%,20%{background:var(--tint)}100%{background:transparent}}
.leads td,.leads th{padding-left:12px;padding-right:12px}.leads.compact td{padding-top:8px;padding-bottom:8px}
.who-cell{display:flex;align-items:center;gap:10px;min-width:180px}
.who-cell b{font-weight:500;display:block}
.who-cell span{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.sla{display:inline-flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text-secondary)}
.sla svg{width:22px;height:22px;transform:rotate(-90deg);flex:none}
.sla .trk{stroke:var(--hover)}.sla .prg{stroke:var(--brand);transition:stroke-dashoffset 1s linear,stroke .3s}
.sla[data-l="warn"]{color:var(--warning-text)}.sla[data-l="warn"] .prg{stroke:var(--warning-solid)}
.sla[data-l="late"]{color:var(--danger-text)}.sla[data-l="late"] .prg{stroke:var(--danger-solid)}
.sla[data-l="done"]{color:var(--success-text)}.sla[data-l="done"] .prg{stroke:var(--success-solid)}
.bulk{display:flex;align-items:center;gap:6px;background:#0A1628;color:#fff;border-radius:12px;padding:6px 6px 6px 16px;box-shadow:var(--shadow-float);margin:12px;animation:tin .22s var(--ease)}
.bulk .btn-ghost{color:#C9D3E1}.bulk .btn-ghost:hover{background:#12233B;color:#fff}
.menu{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-float);padding:6px;min-width:230px;animation:tin .22s var(--ease)}
.menu button{display:flex;width:100%;align-items:center;gap:8px;height:36px;padding:0 8px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu .cur{margin-left:auto;color:var(--brand)}

/* ===== Feedback ===== */
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--toast-bg);color:#fff;border-radius:10px;padding:8px 8px 8px 16px;box-shadow:var(--shadow-float);font-size:14px;min-height:44px;animation:tin .22s var(--ease)}
.toast.out{animation:tout .16s var(--ease-exit) forwards}
.toast button{background:none;border:0;color:#7CC0FF;font-weight:600;cursor:pointer;height:32px;padding:0 10px;border-radius:8px}
.toast button:hover{background:rgba(255,255,255,.1)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(6px)}}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;background:var(--b);color:var(--t);border:1px solid color-mix(in srgb,var(--s) 40%,transparent);flex-wrap:wrap}
.banner .grow{flex:1;min-width:180px}
.banner .btn{margin-left:auto}
.state{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-height:240px;justify-content:center}
.state h4{font-weight:600;font-size:15px}.state p{color:var(--text-secondary);max-width:34ch;font-size:13px}
.sk{background:var(--surface-2);border-radius:6px;position:relative;overflow:hidden;height:12px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--shimmer),transparent);animation:sh 1.2s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border)}
.tabs button{height:40px;border:0;background:none;padding:0;color:var(--text-secondary);font-weight:500;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{color:var(--text)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary);border-radius:2px}
.tabpanel{padding:16px 0 0;color:var(--text-secondary)}
.tip{position:relative;display:inline-flex}
.tip span[role="tooltip"]{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0A1628;color:#fff;font-size:12px;line-height:16px;padding:6px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s var(--ease) .3s}
.tip:hover span[role="tooltip"],.tip:focus-within span[role="tooltip"]{opacity:1}

/* ===== Overlays ===== */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .22s var(--ease)}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-modal);width:min(520px,100%);padding:24px;animation:pop .32s var(--ease)}
.modal h3{font:600 22px/30px var(--font-display);letter-spacing:-.01em}
.modal p{color:var(--text-secondary);margin-top:8px;font-size:15px;line-height:22px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.pal-scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .22s var(--ease)}
.pal{width:min(640px,100%);background:var(--surface);border-radius:16px;box-shadow:var(--shadow-float);overflow:hidden;animation:pop .22s var(--ease)}
.pal .q{position:relative;border-bottom:1px solid var(--border)}
.pal .q .ic{position:absolute;left:16px;top:18px;color:var(--text-muted)}
.pal .q input{border:0;height:56px;width:100%;padding:0 16px 0 46px;font-size:16px;background:transparent;outline:none}
.pal .list{max-height:52vh;overflow:auto;padding:6px 0 8px}
.pal .grp{font-size:12px;color:var(--text-muted);padding:10px 16px 4px;font-weight:500}
.pal .it{display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;cursor:pointer;color:var(--text)}
.pal .it .ic{color:var(--text-secondary)}
.pal .it[aria-selected="true"]{background:var(--tint)}
.pal .foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)}

/* ===== Conversation ===== */
.convo{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;height:680px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface)}
.clist{border-right:1px solid var(--border);overflow:auto}
.cgroup{font-size:12px;font-weight:500;color:var(--text-muted);padding:14px 16px 6px;display:flex;align-items:center;gap:8px}
.citem{display:flex;gap:12px;padding:12px 16px;cursor:pointer;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--hover);align-items:flex-start}
.citem:hover{background:var(--surface-2)}
.citem[aria-current="true"]{background:var(--tint);box-shadow:inset 3px 0 0 var(--brand)}
.citem .tx{min-width:0;flex:1}
.citem .tx b{font-weight:500;display:flex;justify-content:space-between;gap:8px}
.citem .tx p{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.thread{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.thead{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px 0 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.thead .nm{font-weight:600}.thead .cap{color:var(--text-muted)}
.msgs{flex:1;overflow:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:72%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.msg.lead{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px}
.msg.ai{align-self:flex-end;background:var(--bubble-ai);border-bottom-right-radius:6px}
.msg.human{align-self:flex-end;background:var(--bubble-human);color:var(--bubble-human-text);border-bottom-right-radius:6px}
.mwho{font-size:12px;line-height:16px;color:var(--text-muted);display:flex;gap:6px;align-items:center;margin-top:10px}
.mwho.r{align-self:flex-end}.mwho .ic{color:var(--brand);width:14px;height:14px}
.sys{align-self:stretch;display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:12px;line-height:16px;margin:12px 0;text-align:center}
.sys::before,.sys::after{content:"";flex:1;height:1px;background:var(--border);min-width:20px}
.statebar{min-height:40px;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;font-size:13px;font-weight:500;background:var(--b);color:var(--t);border-top:1px solid var(--border);flex-wrap:wrap}
.statebar .grow{flex:1;min-width:160px}
.statebar .btn{height:30px;padding:0 10px;font-size:13px}
.draft{margin:10px 16px 0;border:1px dashed var(--brand);background:var(--tint);border-radius:12px;padding:12px 14px}
.draft .hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--info-text)}
.draft .hd .ic{color:var(--brand);width:14px;height:14px}
.draft .bd{margin-top:6px;font-size:15px;line-height:1.55}
.draft textarea{width:100%;margin-top:8px;border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;background:var(--surface);resize:vertical;min-height:84px;line-height:1.5}
.draft .src{font-size:12px;color:var(--text-muted);margin-top:6px}
.draft .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.composer{display:flex;align-items:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface);margin-top:10px}
.composer textarea{flex:1;resize:none;border:1px solid var(--border-strong);border-radius:10px;padding:9px 12px;height:40px;max-height:144px;background:var(--surface);line-height:20px;outline:none}
.composer textarea:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--focus)}
.ctx{border-left:1px solid var(--border);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.ctx h4{font-size:12px;color:var(--text-muted);font-weight:500;margin-bottom:6px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;font-size:13px}
.kv dt{color:var(--text-muted)}.kv dd{margin:0}
.factors{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-top:8px}
.factors div{display:flex;gap:8px}.factors .p{color:var(--success-text);font-weight:600;width:12px}.factors .n{color:var(--danger-text);font-weight:600;width:12px}
.typing{display:inline-flex;gap:3px;align-items:center}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--brand);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (max-width:1180px){.convo{grid-template-columns:270px minmax(0,1fr)}.ctx{display:none}}
@media (max-width:760px){.convo{grid-template-columns:1fr;height:auto}.clist{border-right:0;border-bottom:1px solid var(--border);max-height:240px}.msgs{min-height:380px;max-height:520px}.msg{max-width:86%}}

/* ===== Motion & code ===== */
.demo{display:flex;flex-direction:column;gap:14px}
.mini{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.mini div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hover);font-size:13px}
.mini div:last-child{border-bottom:0}
.mini .flash{animation:flash 2s var(--ease)}
.slide{animation:slidein .32s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateY(-10px)}}
pre.code{margin:0;background:var(--code-bg);color:#E8EDF5;border-radius:16px;padding:20px;overflow:auto;font:400 13px/20px var(--font-mono);max-height:560px;tab-size:2}
.codehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;flex-wrap:wrap}
footer.end{margin-top:96px;padding-top:24px;border-top:1px solid var(--border);color:var(--text-muted);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .sk::after{display:none}
}

/* ===== Enquira app layer (on top of the design-system CSS) ===== */
.shell{grid-template-columns:240px minmax(0,1fr)}
.side .brand{padding:2px 10px 18px}
.clinic{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin:0 0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;text-align:left;cursor:pointer;font-weight:500}
.clinic:hover{background:rgba(255,255,255,.08)}
.clinic .lg{width:28px;height:28px;border-radius:8px;background:#E8F2FE;color:#0A1628;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}
.clinic small,.me small{display:block;color:var(--sidebar-text);font-size:12px;line-height:16px;font-weight:400}
.nav a .count{margin-left:auto}
.nav a .count.alert{background:#B83A3A;color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:6px 4px 0;color:#fff;font-weight:500}
.appmain{min-width:0;display:flex;flex-direction:column;min-height:100dvh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;min-height:60px;display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar h1{font:600 20px/28px var(--font-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .grow{flex:1}
.topbar .tb-logo{display:none;flex:none}.topbar .iconbtn,.topbar .searchbtn{flex:none}.seg button{white-space:nowrap}
.searchbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text-muted);cursor:pointer;min-width:240px}
.searchbtn:hover{border-color:var(--text-muted)}
.searchbtn .kbd{margin-left:auto;border-color:var(--border-strong);color:var(--text-muted);opacity:1}
.bell{position:relative}
.bell .dotn{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--danger-fill);color:var(--on-danger);font-size:10px;font-weight:600;line-height:16px;box-shadow:0 0 0 2px var(--bg)}
#view{padding:24px 28px 140px;max-width:1440px;width:100%;margin:0 auto;min-width:0}
#gbanner{padding:12px 28px 0;max-width:1440px;width:100%;margin:0 auto}
#gbanner:empty{display:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h2{font:600 28px/36px var(--font-display);letter-spacing:-.015em}
.pagehead p{color:var(--text-secondary);margin-top:4px}
.pagehead .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
@media (max-width:1180px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.dgrid{grid-template-columns:1fr}.span2,.five{grid-column:auto}}
.box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;min-width:0}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ptitle h3{font:600 16px/24px var(--font-sans)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hover);min-width:0}
.lrow:last-child{border-bottom:0}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .tx span{font-size:12px;color:var(--text-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.lrow{width:100%;background:none;border:0;border-bottom:1px solid var(--hover);text-align:left;cursor:pointer;border-radius:0}
button.lrow:hover{background:var(--surface-2)}
.flashc{animation:flashc 1.8s var(--ease)}
@keyframes flashc{0%,35%{box-shadow:0 0 0 3px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.hbar .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:5px;transform-origin:left;animation:grow .6s var(--ease) both}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.chart{width:100%;height:auto;display:block}
.chart text{font:500 11px var(--font-sans);fill:var(--text-muted)}
.funnelrow{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:5px 0;font-size:13px}
.funnelrow .tr{height:28px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.funnelrow .tr i{display:flex;align-items:center;height:100%;border-radius:6px;padding-left:10px;color:#0A1628;font-weight:600;font-variant-numeric:tabular-nums;transform-origin:left;animation:grow .6s var(--ease) both;white-space:nowrap}
.funnelrow .cv{font-size:12px;color:var(--text-muted);text-align:right}
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stabs button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);font-weight:500;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.stabs button[aria-pressed="true"]{background:#0A1628;border-color:#0A1628;color:#fff}
:root[data-theme="dark"] .stabs button[aria-pressed="true"]{background:#E8EDF5;border-color:#E8EDF5;color:#0A1628}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stabs button[aria-pressed="true"]{background:#E8EDF5;border-color:#E8EDF5;color:#0A1628}}
.stabs .n{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.leads tbody tr{cursor:pointer}
/* drawer */
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .22s var(--ease)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow-modal);display:flex;flex-direction:column;animation:dr .32s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes dr{from{transform:translateX(28px);opacity:0}}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.drawer .dh h3{font:600 20px/28px var(--font-display);letter-spacing:-.01em}
.drawer .db{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:22px}
.drawer .df{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.drawer h4{font-size:12px;color:var(--text-muted);font-weight:500;margin-bottom:8px}
.tl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--hover)}
.tl:last-child::before{display:none}
.tl .dotc{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--b);color:var(--t)}
.tl .dotc .ic{width:14px;height:14px}
.tl b{font-weight:500}.tl span{display:block;font-size:12px;color:var(--text-muted)}
/* calendar */
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;color:var(--text-secondary)}
.daypick button[aria-pressed="true"]{border-color:var(--brand);background:var(--tint);color:var(--info-text)}
.cal{display:grid;grid-template-columns:64px repeat(3,minmax(200px,1fr));border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);min-width:700px}
.cal .colh{height:56px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;padding:0 14px;background:var(--surface-2)}
.cal .colh b{font-weight:600}.cal .colh span{font-size:12px;color:var(--text-muted)}
.cal .times{border-right:1px solid var(--border)}
.cal .col{position:relative;border-right:1px solid var(--hover)}
.cal .col:last-child{border-right:0}
.cal .slot{height:44px;border-bottom:1px solid var(--hover)}
.cal .slot:nth-child(even){border-bottom-style:dashed}
.cal .tlab{height:44px;font-size:11px;color:var(--text-muted);padding:3px 8px 0;text-align:right;font-variant-numeric:tabular-nums}
.appt{position:absolute;left:6px;right:6px;border-radius:8px;padding:5px 8px;font-size:12px;line-height:16px;background:var(--b);color:var(--t);border:0;border-left:3px solid var(--s);cursor:pointer;overflow:hidden;text-align:left;display:block;z-index:1}
.appt:hover{filter:brightness(.98);z-index:3}
.appt b{display:block;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.appt.held{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--s) 14%,transparent) 6px 12px)}
.appt.cancel b{text-decoration:line-through;color:var(--text-muted)}
.appt.outline{background:transparent;border:1px dashed var(--border-strong);border-left:3px solid var(--border-strong)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger-solid);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger-solid)}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slotgrid button{height:40px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums}
.slotgrid button[aria-pressed="true"]{border-color:var(--brand);background:var(--tint);color:var(--info-text);box-shadow:0 0 0 1px var(--brand)}
.slotgrid button:disabled{background:var(--surface-2);color:var(--text-muted);text-decoration:line-through;cursor:not-allowed}
/* follow-up steps */
.steps{display:flex;align-items:flex-start;min-width:300px}
.steps .st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:14px;color:var(--text-muted);width:64px;text-align:center}
.steps .st i{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);display:block}
.steps .st[data-s="SENT"] i{background:var(--info-solid);border-color:var(--info-solid)}
.steps .st[data-s="SCHEDULED"] i{border-color:var(--info-solid)}
.steps .st[data-s="SKIPPED"] i{background:var(--hover);border-style:dashed}
.steps .st[data-s="STOPPED"] i{background:var(--warning-solid);border-color:var(--warning-solid)}
.steps .st[data-s="FAILED"] i{background:var(--danger-solid);border-color:var(--danger-solid)}
.steps .ln{flex:1;height:2px;background:var(--border);margin-top:8px;min-width:10px}
/* settings */
.settings{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.setnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:84px}
.setnav button{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;border:0;background:none;color:var(--text-secondary);font-weight:500;cursor:pointer;text-align:left}
.setnav button:hover{background:var(--hover);color:var(--text)}
.setnav button[aria-current="true"]{background:var(--tint);color:var(--info-text)}
@media (max-width:860px){.settings{grid-template-columns:1fr}.setnav{position:static;flex-direction:row;overflow-x:auto}.setnav button{white-space:nowrap}}
.choice{border:1px solid var(--border-strong);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:var(--surface);text-align:left;width:100%}
.choice:hover{border-color:var(--text-muted)}
.choice[aria-checked="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:var(--tint)}
.choice .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-strong);flex:none;margin-top:2px;position:relative;background:var(--surface)}
.choice[aria-checked="true"] .rd{border-color:var(--primary)}
.choice[aria-checked="true"] .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.choice b{font-weight:600;display:block}.choice span{font-size:13px;color:var(--text-secondary)}
.integ{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.integ .lg{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex:none}
.integ .tx{flex:1;min-width:0}.integ .tx b{font-weight:600}.integ .tx span{display:block;font-size:13px;color:var(--text-secondary)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--hover)}
.setrow:last-child{border-bottom:0}
.setrow b{font-weight:500}.setrow span{display:block;font-size:13px;color:var(--text-secondary)}
/* notifications popover */
.npop{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:20px;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-float);z-index:60;animation:tin .22s var(--ease);overflow:hidden}
.npop .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.npop .hd b{font-weight:600}
.npop .bd{max-height:60vh;overflow:auto}
.npop .lrow{padding:12px 16px}
/* demo panel */
.demo{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;width:350px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-float);overflow:hidden}
.demo .dhd{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;background:#0A1628;color:#fff;font-weight:600}
.demo .dhd .ic{color:#3B9EFF}
.demo .dhd button{margin-left:auto;background:none;border:0;color:#C9D3E1;cursor:pointer;height:28px;padding:0 8px;border-radius:8px;font-weight:500;font-size:12px}
.demo .dhd button:hover{background:#12233B;color:#fff}
.demo .dbody{padding:14px;display:flex;flex-direction:column;gap:12px;max-height:min(70vh,560px);overflow:auto}
.demo.min .dbody{display:none}
.jsteps{display:flex;flex-direction:column;gap:6px;font-size:13px}
.jsteps div{display:flex;gap:8px;align-items:center;color:var(--text-muted)}
.jsteps div.done,.jsteps div.cur{color:var(--text)}.jsteps div.cur{font-weight:600}
.jsteps .n{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--text-secondary);flex:none}
.jsteps div.done .n{background:var(--success-bg);color:var(--success-text)}
.jsteps div.cur .n{background:var(--primary);color:var(--on-primary)}
.caption{font-size:13px;line-height:19px;color:var(--text-secondary);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.demo .row .btn{flex:1}
.demo hr{border:0;border-top:1px solid var(--border);margin:2px 0}
/* bottom nav (phones) */
.bnav{display:none}
.morepop{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:66;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-float);padding:8px;animation:tin .22s var(--ease)}
.morepop button{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 12px;border:0;background:none;border-radius:10px;font-weight:500;cursor:pointer;color:var(--text)}
.morepop button:hover{background:var(--hover)}
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .topbar{padding:0 16px}.topbar .tb-logo{display:flex}
  #view{padding:16px 16px 210px}#gbanner{padding:12px 16px 0}
  .searchbtn{min-width:0;width:36px;padding:0;justify-content:center}.searchbtn .lab,.searchbtn .kbd{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{flex:1;height:58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--text-muted);position:relative;cursor:pointer}
  .bnav button[aria-current="page"]{color:var(--primary)}
  .bnav .count{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .demo{right:12px;left:12px;width:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .toasts{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .convo.full{height:auto}
}
@media (min-width:761px){.convo.full{height:max(560px,calc(100dvh - 200px))}}
.typingrow{align-self:flex-end;display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:12px;margin-top:6px}
.qr{display:flex;gap:6px;flex-wrap:wrap;align-self:flex-end;margin-top:4px}
.qr span{height:30px;display:inline-flex;align-items:center;padding:0 12px;border-radius:999px;border:1px solid var(--brand);color:var(--info-text);font-size:13px;font-weight:500;background:var(--surface)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 20px;color:var(--text-secondary)}
.empty h4{font-weight:600;color:var(--text);font-size:15px}
/* ===== v2 additions ===== */
.drawer.wide{width:min(760px,100%)}
.navgrp{font-size:11px;line-height:16px;font-weight:500;color:#5E6B80;padding:14px 12px 4px}
.nav a{height:34px}
.nav a .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:1024px) and (max-width:1279px){
 .shell{grid-template-columns:72px minmax(0,1fr)}.side{padding:18px 10px}.side .brand{padding:2px 0 14px;display:flex;justify-content:center}
 .prodtag{display:none}.side .brand .full{display:none}.side .brand .mark{display:block!important}.clinic{justify-content:center;padding:8px 0}.clinic>span:last-child{display:none}
 .nav a{justify-content:center;padding:0}.nav a .lbl,.nav a .count,.navgrp{display:none}.nav a.on::before{left:-10px}
 .side .foot .kbtn span:not(:first-child),.side .foot .theme,.me>span:last-child{display:none}.kbtn{justify-content:center;padding:0}.me{justify-content:center}}
.prodtag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(59,158,255,.16);color:#7CC0FF;margin:0 10px 12px;align-self:flex-start}
.demo-ribbon{background:var(--tint);color:var(--info-text);font-size:12px;font-weight:500;text-align:center;padding:6px 12px;border-bottom:1px solid var(--border)}
.tr-line{display:block;font-size:13px;line-height:18px;color:var(--text-muted);margin-top:4px;font-style:normal}
.msg.human .tr-line{color:#C9D3E1}.msg.ai .tr-line{color:var(--text-secondary)}
.msg.call{align-self:stretch;max-width:100%;background:var(--surface);border:1px dashed var(--border-strong);font-size:14px}
.aitag{display:flex;gap:6px;align-items:center;flex-wrap:wrap;align-self:flex-end;font-size:11px;color:var(--text-muted);margin-top:3px}
.aitag .chip{height:20px;font-size:11px;padding:0 8px}
.msg.emer{border:2px solid var(--danger-solid)!important}
.stages{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.stg{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0}
.stg b{display:block;font:600 22px/28px var(--font-display);font-variant-numeric:tabular-nums}.stg span{font-size:12px;color:var(--text-muted)}.stg i{font-style:normal;font-size:12px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:6px}
@media (max-width:1180px){.stages{grid-template-columns:repeat(4,minmax(0,1fr))}}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;align-items:start;min-width:1340px}
.kcol{background:var(--surface-2);border-radius:14px;padding:10px;min-height:200px}
.kcol.over{outline:2px dashed var(--brand);outline-offset:-2px}
.kolh{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;font-weight:600;gap:8px}
.kolh span{font-size:12px;color:var(--text-muted);font-weight:500}
@media (max-width:1100px){.apgrid{grid-template-columns:1fr!important}}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab;display:block;width:100%;text-align:left}
.kcard:hover{border-color:var(--border-strong)}.kcard b{font-weight:600;display:block}.kcard .cap{display:block}
.kcard .nba{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--info-text);margin-top:6px;line-height:16px}.kcard .nba .ic{width:12px;height:12px;flex:none;margin-top:2px;color:var(--brand)}
.alarm{position:fixed;inset:0;z-index:95;background:#7F1D1D;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s}
.alarm .in{width:min(720px,100%);text-align:left}
.alarm h2{font:600 40px/48px var(--font-display);letter-spacing:-.02em;margin:10px 0 6px}
.alarm .pulse{width:64px;height:64px;border-radius:50%;background:#fff;color:#B83A3A;display:flex;align-items:center;justify-content:center;animation:al 1s infinite}
.alarm .pulse .ic{width:34px;height:34px}
@keyframes al{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.alarm .q{background:rgba(255,255,255,.12);border-radius:12px;padding:14px 16px;margin:16px 0;font-size:16px;line-height:24px}
.alarm .oncall{display:flex;flex-direction:column;gap:8px;margin:12px 0 20px}
.alarm .oncall div{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:10px;padding:10px 12px}
.alarm .oncall b{font-weight:600}.alarm .oncall em{margin-left:auto;font-style:normal;font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.alarm .btns{display:flex;gap:10px;flex-wrap:wrap}.alarm .accept{background:#fff;color:#7F1D1D;height:52px;padding:0 24px;font-size:17px}
.alarm .ghostw{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;height:52px}
.callcard{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));right:20px;z-index:66;width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-float);overflow:hidden;animation:tin .22s var(--ease)}
.callcard .ch{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#0A1628;color:#fff}.callcard .ch b{font-weight:600}
.callcard .cb{padding:12px 14px;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:14px}
.callcard .ln{padding:8px 10px;border-radius:10px;background:var(--surface-2)}.callcard .ln.ai{background:var(--tint)}
.callcard .ln small{display:block;color:var(--text-muted);font-size:12px;margin-top:2px}
.ring{animation:al 1s infinite;border-radius:50%}
.qrbox{width:168px;height:168px;background:#fff;border-radius:12px;padding:10px;border:1px solid var(--border)}
.token{font:600 64px/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.phone{max-width:340px;background:#ECE5DD;border-radius:18px;padding:12px;border:1px solid var(--border)}
.phone .wa{background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;line-height:19px;color:#111;white-space:pre-line}
.bars3{display:flex;gap:10px;flex-wrap:wrap}.gate{flex:1;min-width:180px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface)}
.gate b{font:600 24px/30px var(--font-display);display:block;font-variant-numeric:tabular-nums}.gate span{font-size:12px;color:var(--text-muted)}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--brand);border-radius:4px}
.photo{aspect-ratio:1;border-radius:10px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--hover) 10px 20px);display:flex;align-items:flex-end;padding:8px;font-size:11px;color:var(--text-secondary);border:1px solid var(--border)}

</style>

 if(T.id==="bkP"){BK.pid=T.value||null;drawRender();}if(T.id==="bkT"){BK.tr=T.value;BK.res=TR[T.value].res;BK.slot=null;drawRender();}if(T.id==="bkR"){BK.res=T.value;BK.slot=null;drawRender();}
 if(T.id==="qtP"){QT.pid=T.value||null;drawRender();}if(T.id==="qtT"){QT.tr=T.value;drawRender();}if(T.id==="qtPRP"){QT.prp=T.checked;drawRender();}
 if(["rbM","rbG","rbD"].includes(T.id)){RB={m:$("#rbM").value,g:$("#rbG").value,d:+$("#rbD").value};$("#rbBody").innerHTML=rbBody();return;}
 if(T.id==="qtG"){QT.grafts=Math.max(500,Math.min(5000,+T.value.replace(/[^\d]/g,"")||2400));drawRender();}if(T.id==="qtS"){QT.sessions=Math.max(1,Math.min(12,+T.value.replace(/[^\d]/g,"")||4));drawRender();}});
document.addEventListener("input",e=>{const T=e.target;if(T.id==="lq"){LQ=T.value.trim().toLowerCase();const k=T.selectionStart;render();const n=$("#lq");n.focus();n.setSelectionRange(k,k);}
 if(T.id==="pq"){PQ=T.value.trim().toLowerCase();const k=T.selectionStart;render();const n=$("#pq");n.focus();n.setSelectionRange(k,k);}
 if(T.id==="cmp"){T.style.height="40px";T.style.height=Math.min(T.scrollHeight,144)+"px";}});
document.addEventListener("submit",e=>{if(e.target.id!=="composer")return;e.preventDefault();const t=$("#cmp"),v=t.value.trim();if(!v||!CUR)return;t.value="";humanSend(conv(CUR),v);toast("Message sent");});
document.addEventListener("dragstart",e=>{const k=e.target.closest&&e.target.closest("[data-card]");if(k){e.dataTransfer.setData("text/plain",k.dataset.card);e.dataTransfer.effectAllowed="move";}});
document.addEventListener("dragover",e=>{const col=e.target.closest&&e.target.closest("[data-col]");if(col){e.preventDefault();$$(".kcol.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over");}});
document.addEventListener("drop",e=>{const col=e.target.closest&&e.target.closest("[data-col]");$$(".kcol.over").forEach(x=>x.classList.remove("over"));if(!col)return;e.preventDefault();const p=person(e.dataTransfer.getData("text/plain"));if(p)moveStage(p,col.dataset.col);});
let gK=0;
document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||"");if(ALARM)return;
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();const o=$(".pal-scrim");o?o.remove():openPalette();return;}
 if(e.key==="Escape"){if($("#modal")){closeModal();return;}if(POP||$(".npop")||$(".morepop")){closePops();return;}if(DR){closeDrawer();return;}}
 if(e.target.id==="cmp"&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();$("#composer").requestSubmit();return;}
 if(typing||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==="g"){gK=now();return;}if(now()-gK<900){const m={h:"home",i:"inbox",c:"calls",p:FULL?"patients":"leads",s:"settings",r:"reports"}[e.key];if(m){go(m);gK=0;}}});
$$("[data-theme-set]").forEach(b=>b.addEventListener("click",()=>applyTheme(b.dataset.themeSet)));
$("#mTheme").addEventListener("click",()=>applyTheme(isDark()?"light":"dark"));

seed();balancePays();seedCalls();seedMore();

S.wait=[{n:"Siva K.",want:"Any morning consultation this week"},{n:"Thomas K.",want:"PRP session, Saturday"},{n:"Varun B.",want:"Evening consultation with Dr. Arun"}];
if(FULL){const sv=S.people.find(p=>p.name==="Siva K.");if(sv)mkPerson({name:"Sivakumar K.",phone:sv.phone,ch:"WEB",tr:sv.tr,created:now()-3*DAY,owner:"priya"});}
let saved="system";try{saved=localStorage.getItem("enq-v2-theme")||"system";}catch(e){}applyTheme(saved);
hydrate(document);if(!/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||""))$$(".kbd").forEach(k=>k.textContent="Ctrl K");
const od=(document.querySelector('meta[name="enquira-other-demo"]')||{}).content;if(od){const a=$("#otherDemo");a.href=od;a.hidden=false;}
const hv=(location.hash||"").slice(1);if(VIEWS[hv])VIEW=hv;render();jRender();setInterval(paintAll,1000);
